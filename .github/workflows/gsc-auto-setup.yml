name: GSC Auto-Setup & Sitemap Submit

on:
  # Manual trigger untuk submit sitemap
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'submit-sitemap'
        type: choice
        options:
          - submit-sitemap
          - check-indexing
          - verify-robots

  # Auto-trigger setelah deployment
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'sitemap.xml'

jobs:
  submit-sitemap:
    name: Auto-Submit Sitemap to Google
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.inputs.action == 'submit-sitemap'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify GSC Verification
        run: |
          echo "🔍 Checking Google Search Console verification..."

          if grep -q 'google-site-verification=' index.html; then
            VERIFICATION=$(grep -oP 'google-site-verification=\K[^"]+' index.html)
            echo "✅ Verification code found: ${VERIFICATION:0:20}..."
          else
            echo "⚠️  Verification code not found in index.html"
            echo "Please add verification code first:"
            echo "  node scripts/update-gsc-verification.js <code>"
            exit 1
          fi

      - name: Verify Sitemap
        run: |
          echo "🔍 Checking sitemap.xml..."
          if [ -f sitemap.xml ]; then
            echo "✅ sitemap.xml found"
            echo "📊 Sitemap has $(grep -c '<url>' sitemap.xml) URLs"
          else
            echo "❌ sitemap.xml not found"
            exit 1
          fi

      - name: Submit Sitemap to Google
        run: |
          echo "📤 Submitting sitemap to Google Search Console..."

          SITEMAP_URL="https://kholidrental.com/sitemap.xml"

          # Submit to Google
          curl -X POST "https://www.google.com/ping?sitemap=${SITEMAP_URL}" \
            -H "User-Agent: Mozilla/5.0" \
            -w "\nHTTP Status: %{http_code}\n" \
            || echo "⚠️  Note: Google ping endpoint may not return visible response"

          echo ""
          echo "✅ Sitemap submission request sent!"

      - name: Verify Live Website
        run: |
          echo "🔗 Verifying website is accessible..."

          # Check main domain
          curl -s -I https://kholidrental.com | head -5

          # Check robots.txt
          echo ""
          echo "Checking robots.txt..."
          curl -s -I https://kholidrental.com/robots.txt | head -2

          # Check sitemap
          echo ""
          echo "Checking sitemap.xml..."
          curl -s -I https://kholidrental.com/sitemap.xml | head -2

          echo "✅ Website is live and accessible!"

      - name: Send Success Notification
        if: success()
        run: |
          echo "🎉 SUCCESS!"
          echo ""
          echo "✅ Sitemap submitted to Google"
          echo "✅ Website verified accessible"
          echo "✅ Robots.txt & Sitemap verified"
          echo ""
          echo "📋 NEXT STEPS:"
          echo "1. Open Google Search Console"
          echo "2. Go to Sitemaps section"
          echo "3. Confirm sitemap.xml appears"
          echo "4. Monitor indexing progress"
          echo ""
          echo "🔗 Links:"
          echo "   • Google Search Console: https://search.google.com/search-console"
          echo "   • Your Sitemap: https://kholidrental.com/sitemap.xml"
          echo "   • Robots.txt: https://kholidrental.com/robots.txt"

  check-indexing:
    name: Check Google Indexing Status
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'check-indexing'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report Indexing Status
        run: |
          echo "📊 Google Indexing Status Report"
          echo "=================================="
          echo ""
          echo "Website: https://kholidrental.com"
          echo "Submitted: $(date)"
          echo ""
          echo "✅ To check actual indexing:"
          echo "   1. Open Google Search Console"
          echo "   2. Go to 'Pages' section"
          echo "   3. See which pages are indexed"
          echo ""
          echo "📈 Typical Timeline:"
          echo "   • 1-2 weeks: First indexing"
          echo "   • 2-4 weeks: Appears in search"
          echo "   • 1-3 months: Ranking"
          echo ""
          echo "💡 Boost indexing:"
          echo "   • Get backlinks from other sites"
          echo "   • Update content regularly"
          echo "   • Monitor GSC for crawl errors"

  verify-robots:
    name: Verify Robots.txt & Metadata
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'verify-robots'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify All SEO Files
        run: |
          echo "✅ SEO Files Verification"
          echo "========================="
          echo ""

          # Check robots.txt
          if [ -f robots.txt ]; then
            echo "✅ robots.txt exists"
            echo "   Lines: $(wc -l < robots.txt)"
          else
            echo "❌ robots.txt missing"
          fi

          # Check sitemap.xml
          if [ -f sitemap.xml ]; then
            echo "✅ sitemap.xml exists"
            URLS=$(grep -c '<url>' sitemap.xml)
            echo "   URLs listed: $URLS"
          else
            echo "❌ sitemap.xml missing"
          fi

          # Check schema.json
          if [ -f schema.json ]; then
            echo "✅ schema.json exists"
          else
            echo "⚠️  schema.json missing"
          fi

          # Check HTML meta tags
          echo ""
          echo "✅ HTML Meta Tags:"
          grep -c 'meta name=' index.html && echo "   Found multiple meta tags"
          grep -c 'google-site-verification' index.html && echo "   ✅ GSC verification found"
          grep -c 'application/ld+json' index.html && echo "   ✅ Schema.org structured data found"
